name: Spec / implementation mismatch
description: "specs/*.md doesn't match what the reference implementation actually does (either the spec is wrong, or the implementation is)."
labels: ["spec"]
body:
  - type: dropdown
    id: spec
    attributes:
      label: Which spec
      options:
        - specs/runtime-adapter-contract.md
        - specs/e2ee-envelope-format.md
        - other
    validations:
      required: true
  - type: textarea
    id: mismatch
    attributes:
      label: What the spec says vs. what the code does
      description: Quote the relevant line(s) from the spec and point to the code that disagrees.
    validations:
      required: true
